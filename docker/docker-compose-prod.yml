name: seeloud

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ../Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    networks:
      - seeloud
    depends_on:
      - web
      - api
      - ws

  migrate:
    image: sameerkrdev/seeloud-api:latest
    build: { context: .., dockerfile: docker/api/Dockerfile }
    command: sh -c "cd /app/packages/db && bunx prisma migrate deploy"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - seeloud
    restart: "no"

  web:
    image: sameerkrdev/seeloud-web:latest
    build:
      context: ..
      dockerfile: docker/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - seeloud
    depends_on:
      api:
        condition: service_healthy
      ws:
        condition: service_healthy

  api:
    image: sameerkrdev/seeloud-api:latest
    build: { context: .., dockerfile: docker/api/Dockerfile }
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      ENV_ENCRYPTION_KEY: ${ENV_ENCRYPTION_KEY}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI}
      FRONTEND_URL: https://${APP_DOMAIN}
      WORKER_SECRET: ${WORKER_SECRET}
      BASE_DOMAIN: app.${APP_DOMAIN}
      ACTIONS_WEBHOOK_BASE_URL: https://api.${APP_DOMAIN}
      SANDBOX_ENGINE_URL: http://seeloud-sandbox-engine:3003
      SANDBOX_ENGINE_SECRET: ${SANDBOX_ENGINE_SECRET}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - seeloud

  ws:
    image: sameerkrdev/seeloud-ws:latest
    build: { context: .., dockerfile: docker/ws/Dockerfile }
    restart: unless-stopped
    expose:
      - "3002"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      WS_PORT: 3002
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - seeloud

  worker:
    image: sameerkrdev/seeloud-worker:latest
    build: { context: .., dockerfile: docker/worker/Dockerfile }
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp:/tmp
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      ENV_ENCRYPTION_KEY: ${ENV_ENCRYPTION_KEY}
      WORKER_SECRET: ${WORKER_SECRET}
      API_BASE_URL: http://api:3001
      BASE_DOMAIN: app.${APP_DOMAIN}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - seeloud

  action-worker:
    image: sameerkrdev/seeloud-action-worker:latest
    build: { context: .., dockerfile: docker/action-worker/Dockerfile }
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp:/tmp
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ENV_ENCRYPTION_KEY: ${ENV_ENCRYPTION_KEY}
      WORKER_SECRET: ${WORKER_SECRET}
      SEELOUD_ACTIONS_INTERNAL_URL: http://api:3001
      WORKER_CONCURRENCY: ${ACTION_WORKER_CONCURRENCY:-2}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      - seeloud

  seeloud-sandbox-engine:
    image: sameerkrdev/seeloud-sandbox-engine:latest
    build: { context: .., dockerfile: docker/seeloud-sandbox-engine/Dockerfile }
    restart: unless-stopped
    environment:
      PORT: 3003
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-oven/bun:alpine}
      SANDBOX_ENGINE_SECRET: ${SANDBOX_ENGINE_SECRET}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp:/tmp
    networks:
      - seeloud

  seeloudcron:
    image: sameerkrdev/seeloud-seeloudcron:latest
    build: { context: .., dockerfile: docker/seeloudcron/Dockerfile }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      WORKER_SECRET: ${WORKER_SECRET}
      API_BASE_URL: http://api:3001
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - seeloud

  seeloudfn-runtime:
    image: sameerkrdev/seeloud-seeloudfn-runtime:latest
    build: { context: .., dockerfile: docker/seeloudfn-runtime/Dockerfile }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      SEELOUDFN_CACHE_DIR: /var/seeloudfn
    volumes:
      - seeloudfn_cache:/var/seeloudfn
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - seeloud

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - seeloud
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - seeloud
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  seeloudfn_cache:

networks:
  seeloud:
    driver: bridge
