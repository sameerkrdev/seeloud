
services:
  seeloudfn-runtime:
    build:
      context: ..
      dockerfile: docker/seeloudfn-runtime/Dockerfile
    restart: unless-stopped
    env_file:
      - ../apps/seeloudfn-runtime/.env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SEELOUDFN_CACHE_DIR: /var/seeloudfn
      WORKERD_BIN: /app/node_modules/workerd/bin/workerd
    volumes:
      - seeloudfn_cache:/var/seeloudfn
    depends_on:
      - redis
    networks:
      - seeloud

  postgres:
    image: postgres:alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: seeloud
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - seeloud

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - seeloud

volumes:
  postgres_data:
  redis_data:
  seeloudfn_cache:

networks:
  seeloud:
    driver: bridge